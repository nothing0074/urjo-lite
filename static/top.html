  if (r.view !== state.view) return;
  if (state.view === 'region' && r.selectedRegion) {
    state.region = r.selectedRegion;
    document.getElementById('sel-region').value = r.selectedRegion;
  }
  if (state.view === 'country' && r.selectedCountry) {
    state.country = r.selectedCountry;
    document.getElementById('sel-country').value = r.selectedCountry;
  }
}

function load(live) {
  var key = ckey(state);
  if (!live && cache[key]) {
    render(cache[key]);
    note(!!isSeed[key]);
    return;
  }
  var board = document.getElementById('board');
  if (!cache[key]) {
    board.innerHTML = 'Loading...';
    note(false);
  }
  serverFn(TOP_FN, payload(state), function (err, val) {
    if (!err && val && val.result) {
      cache[key] = val.result;
      isSeed[key] = false;
      syncSelects(val.result);
      render(val.result);
      note(false);
      return;
    }
    if (cache[key]) {
      render(cache[key]);
      note(true);
      return;
    }
    board.innerHTML = '<span class="flash">Could not load top list. Check the relay.</span>';
  });
}

for (var t = 0; t < TABS.length; t++) {
  (function (v) {
    var b = document.getElementById('v-' + v);
    if (b) b.onclick = function () { setView(v); };
  })(TABS[t]);
}
document.getElementById('sel-region').onchange = function () {
  state.region = this.value;
  load(false);
};
document.getElementById('sel-country').onchange = function () {
  state.country = this.value;
  load(false);
};
document.getElementById('v-refresh').onclick = function () { load(true); };
load(false);
</script>
</body>
</html>
